<h2>Loan Prediction</h2>
<form method="post">
    {% csrf_token %}
    <input type="text" name="state" placeholder="State" required><br>
    <input type="text" name="zip" placeholder="Zip" required><br>
    <input type="text" name="bankstate" placeholder="Bank State" required><br>
    <input type="number" name="approvalfy" placeholder="Approval FY" required><br>
    <button type="submit">Predict</button>
</form>

{% if prediction %}
    <h3>Prediction Result:</h3>
    <pre>{{ prediction }}</pre>
{% endif %}
