<!-- bankapp/templates/bankapp/base.html -->
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SBAWebsite{% endblock %}</title>
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md py-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-2xl font-bold text-blue-500">SBAWebsite</a>
            <ul class="flex space-x-4">
                <li><a href="{% url 'dashboard' %}" class="text-gray-700 hover:text-blue-500">Dashboard</a></li>
                <li><a href="#" class="text-gray-700 hover:text-blue-500">Projects</a></li>
                <li><a href="{% url 'logout' %}" class="text-gray-700 hover:text-red-500">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto my-8">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
