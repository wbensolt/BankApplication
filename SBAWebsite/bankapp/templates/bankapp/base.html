<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureBank{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://unpkg.com/lucide-icons" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100 flex flex-col justify-between">
        <!-- Navigation Bar -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <i data-lucide="building-2" class="h-8 w-8 text-blue-600"></i>
                        <span class="ml-2 text-xl font-semibold text-gray-900">SecureBank</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                            Home
                        </a>
                        <!-- Check if User is Authenticated -->
                        {% if user.is_authenticated %}
                            <!-- Show Logout and Dashboard -->
                            <a href="{% url 'dashboard' %}" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                                <i data-lucide="layout-dashboard" class="h-4 w-4 mr-1"></i>
                                Dashboard
                            </a>
                            <a href="{% url 'logout' %}" class="flex items-center bg-red-600 text-white hover:bg-red-700 px-4 py-2 rounded-md text-sm font-medium">
                                <i data-lucide="log-out" class="h-4 w-4 mr-1"></i>
                                Logout
                            </a>
                        {% else %}
                            <!-- Show Login and Register -->
                            <a href="{% url 'login' %}" class="flex items-center text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                                <i data-lucide="log-in" class="h-4 w-4 mr-1"></i>
                                Login
                            </a>
                            <a href="{% url 'register' %}" class="flex items-center bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-md text-sm font-medium">
                                <i data-lucide="user-plus" class="h-4 w-4 mr-1"></i>
                                Register
                            </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>
<!-- Flash Messages -->
{% if messages %}
    <div class="fixed top-4 right-4 w-full max-w-sm">
        {% for message in messages %}
        <div class="mb-4 p-4 rounded-md shadow-lg 
                    {% if message.tags == 'success' %}bg-green-500 text-white
                    {% elif message.tags == 'error' %}bg-red-500 text-white
                    {% else %}bg-gray-500 text-white{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
{% endif %}

        <!-- Main Content -->
        <main class="flex-grow">
            {% block content %}{% endblock %}
        </main>

        <!-- Compact Footer -->
        <footer class="bg-gray-800 text-gray-400 text-sm py-4">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                <!-- Copyright -->
                <p class="text-gray-400">© 2025 SecureBank. All rights reserved.</p>
                <!-- Social Media Icons -->
                <div class="flex space-x-4">
                    <a href="#" class="text-gray-400 hover:text-blue-500">
                        <i data-lucide="facebook" class="h-5 w-5"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-blue-500">
                        <i data-lucide="twitter" class="h-5 w-5"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-blue-500">
                        <i data-lucide="instagram" class="h-5 w-5"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-blue-500">
                        <i data-lucide="linkedin" class="h-5 w-5"></i>
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Initialize Lucide Icons After DOM Load -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            lucide.createIcons();
        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/alpinejs" defer></script>

<!-- Swiper Element API -->
<script type="module" src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-element-bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
<!-- Swiper.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />

<!-- Swiper.js Script -->
<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js" defer></script>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Auto-dismiss flash messages after 5 seconds
            setTimeout(function() {
                const alerts = document.querySelectorAll('.fixed.top-4.right-4 > div');
                alerts.forEach(alert => alert.classList.add('opacity-0', 'transition-opacity', 'duration-100'));
                setTimeout(() => alerts.forEach(alert => alert.remove()), 100);
            }, 1000);
        });
    </script>
</body>
</html>
