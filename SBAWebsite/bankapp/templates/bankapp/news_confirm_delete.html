{% extends "bankapp/base.html" %}

{% block title %}Delete News Article - SecureBank{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] bg-gray-100 py-12">
    <div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="px-6 py-4 bg-red-50 border-b border-red-100">
                <div class="flex items-center space-x-2">
                    <i data-lucide="alert-triangle" class="h-5 w-5 text-red-600"></i>
                    <h2 class="text-lg font-semibold text-gray-900">Delete Article</h2>
                </div>
            </div>

            <div class="p-6">
                <p class="text-gray-600 mb-6">Are you sure you want to delete the article "<span class="font-medium text-gray-900">{{ object.title }}</span>"? This action cannot be undone.</p>

                <form method="post" class="flex items-center justify-end space-x-3">
                    {% csrf_token %}
                    <a href="{% url 'news_list' %}" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                        <i data-lucide="x" class="h-4 w-4 mr-2"></i>
                        Cancel
                    </a>
                    <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700">
                        <i data-lucide="trash-2" class="h-4 w-4 mr-2"></i>
                        Delete Article
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
